<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e9a900">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <title>Gestão Vovó Maria · Relatórios</title>
  <style>
    *{box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:#F5F0E8;color:#431407;margin:0;padding:16px}.wrap{max-width:1040px;margin:auto}.card{background:#fff;border:1px solid #FED7AA;border-radius:20px;padding:16px;margin-bottom:12px}.nav,.acoes,.atalhos,.grid{display:flex;flex-wrap:wrap;gap:9px}.nav a,.btn{border:0;border-radius:999px;padding:11px 14px;background:#7C2D12;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.btn{background:#EA580C}.btn.sec{background:#FED7AA;color:#7C2D12}.grid>*{flex:1;min-width:180px}input{width:100%;padding:11px;border:2px solid #FED7AA;border-radius:15px}.metricas{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.metrica{background:#FFF7ED;border-radius:16px;padding:13px}.metrica strong{display:block;font-size:20px;color:#EA580C}.status{background:#FEF3C7;padding:12px;border-radius:15px;margin-bottom:12px}.status.ok{background:#D1FAE5}.status.err{background:#FEE2E2}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #FED7AA;vertical-align:top}.empresa{font-weight:900;color:#78350F}.cabecalho-relatorio{display:flex;justify-content:space-between;gap:16px;align-items:start}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:10}.modal[hidden]{display:none}.ticket{background:#fff;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:22px;border-radius:20px}.ticket-item{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed #ccc;padding:7px 0}.right{text-align:right}.venda-nao{color:#78716C}@media(max-width:700px){table{font-size:12px}.cabecalho-relatorio{display:block}.tabela-scroll{overflow:auto}}
    @page{size:A4;margin:12mm}
    @media print{
      body{background:#fff;padding:0;font-size:10pt}.nao-imprimir,.nav,.filtros,.acoes,.status,.btn{display:none!important}.wrap{max-width:none}.card{border:0;border-radius:0;padding:5px 0;margin:0 0 8px;break-inside:avoid}.conteudo-relatorio{display:block!important}.metricas{grid-template-columns:repeat(4,1fr)}table{font-size:8.5pt}th,td{padding:4px}.modal{display:none!important}
      body.imprimir-ticket *{visibility:hidden}body.imprimir-ticket #modalTicket,body.imprimir-ticket #modalTicket *{visibility:visible}body.imprimir-ticket #modalTicket{display:block!important;position:absolute;inset:0;background:#fff;padding:0}body.imprimir-ticket .ticket{max-width:none;max-height:none;overflow:visible;border-radius:0}
    }
  </style>
</head>
<body><main class="wrap">
  <nav class="nav nao-imprimir"><a href="dashboard.html">Dashboard</a><a href="clientes.html">Clientes</a><a href="visita.html">Visita/Venda</a><a id="navProdutos" href="produtos.html">Produtos</a><a href="#" id="sair">Sair</a></nav>
  <section class="card filtros nao-imprimir"><h1 id="tituloTela">Relatório</h1><div class="grid"><label>Data inicial<input id="data_inicial" type="date"></label><label>Data final<input id="data_final" type="date"></label></div><div class="atalhos"><button class="btn" data-periodo="hoje">Hoje</button><button class="btn" data-periodo="semana">Esta semana</button><button class="btn" data-periodo="mes">Este mês</button><button class="btn" id="buscar">Gerar relatório</button></div></section>
  <div id="status" class="status nao-imprimir">Escolha o período.</div>
  <section id="resultado" class="conteudo-relatorio" hidden>
    <header class="card cabecalho-relatorio"><div><div class="empresa">Vovó Maria Pães e Biscoitos</div><h1 id="tituloRelatorio"></h1><div id="periodoRelatorio"></div></div><div class="right"><strong id="usuarioRelatorio"></strong><br><span id="geradoEm"></span></div></header>
    <div class="acoes nao-imprimir card"><button class="btn" id="compartilhar">Compartilhar relatório</button><button class="btn sec" id="copiar">Copiar resumo</button><button class="btn" id="imprimir">Imprimir / Salvar em PDF</button></div>
    <div id="metricas" class="card metricas"></div>
    <section class="card"><h2>Fechamento por forma de pagamento</h2><div id="formas" class="tabela-scroll"></div></section>
    <section id="secaoVendedores" class="card"><h2>Resumo por vendedor</h2><div id="vendedores" class="tabela-scroll"></div></section>
    <section class="card"><h2>Produtos vendidos</h2><div id="produtos" class="tabela-scroll"></div></section>
    <section class="card"><h2>Clientes atendidos</h2><div id="clientes" class="tabela-scroll"></div></section>
    <section class="card"><h2>Vendas do período</h2><div id="vendas" class="tabela-scroll"></div></section>
  </section>
</main>
<div id="modalTicket" class="modal" hidden><article class="ticket"><div id="ticketConteudo"></div><div class="acoes nao-imprimir"><button class="btn" id="imprimirTicket">Imprimir ticket</button><button class="btn sec" id="fecharTicket">Fechar</button></div></article></div>
<script>
const API_URL="https://gestaovomaria-api.odir-bene12.workers.dev";
const token=localStorage.getItem("token");
const role=localStorage.getItem("vendedorRole")||"vendedor";
const nome=localStorage.getItem("vendedorNome")||"Usuário";
if(!token)location.href="login.html";
if(role!=="admin")document.getElementById("navProdutos").hidden=true;
const titulo=role==="admin"?"Relatório administrativo e fechamento de caixa":"Relatório do vendedor";
document.getElementById("tituloTela").textContent=titulo;
const hoje=new Date();const iso=d=>d.toISOString().slice(0,10);const dinheiro=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
let dadosAtuais=null;let textoAtual="";
function periodo(tipo){const fim=new Date(hoje),ini=new Date(hoje);if(tipo==="semana")ini.setDate(hoje.getDate()-((hoje.getDay()+6)%7));if(tipo==="mes")ini.setDate(1);document.getElementById("data_inicial").value=iso(ini);document.getElementById("data_final").value=iso(fim);carregar()}
function setStatus(msg,tipo=""){const el=document.getElementById("status");el.textContent=msg;el.className="status nao-imprimir "+tipo}
function lista(data,campo){return Array.isArray(data?.[campo])?data[campo]:[]}
function tabela(cabecalho,linhas){if(!linhas.length)return "Nenhum registro.";return `<table><thead><tr>${cabecalho.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${linhas.map(l=>`<tr>${l.map(x=>`<td>${x??""}</td>`).join("")}</tr>`).join("")}</tbody></table>`}
function metricas(resumo){const totalBruto=Number(resumo.total_bruto||0),descontos=Number(resumo.descontos||0),liquido=Number(resumo.valor_total||0),recebido=Number(resumo.total_recebido||0),pendente=Number(resumo.total_pendente||0),diferenca=liquido-recebido;const base=[["Visitas",resumo.visitas||0],["Vendas",resumo.compras||0],["Não compraram",resumo.sem_compra||0],["Total bruto",dinheiro(totalBruto)],["Descontos",dinheiro(descontos)],["Total líquido",dinheiro(liquido)],["Total recebido",dinheiro(recebido)],["Total pendente",dinheiro(pendente)],["Diferença",dinheiro(diferenca)],["Clientes atendidos",resumo.clientes_atendidos||0]];return base.map(([a,b])=>`<div class="metrica">${a}<strong>${b}</strong></div>`).join("")}
function montarResumoTexto(d){const r=d.resumo||{};const diferenca=Number(r.valor_total||0)-Number(r.total_recebido||0);return [`Vovó Maria Pães e Biscoitos`,titulo,`Período: ${d.data_inicial} a ${d.data_final}`,`Usuário: ${nome}`,`Visitas: ${r.visitas||0}`,`Vendas: ${r.compras||0}`,`Sem compra: ${r.sem_compra||0}`,`Total bruto: ${dinheiro(r.total_bruto)}`,`Descontos: ${dinheiro(r.descontos)}`,`Total líquido: ${dinheiro(r.valor_total)}`,`Total recebido: ${dinheiro(r.total_recebido)}`,`Total pendente: ${dinheiro(r.total_pendente)}`,`Diferença: ${dinheiro(diferenca)}`].join("\n")}
async function copiarTexto(texto){if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(texto);else{const a=document.createElement("textarea");a.value=texto;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}setStatus("Resumo copiado para a área de transferência.","ok")}
function renderizar(d){dadosAtuais=d;const r=d.resumo&&typeof d.resumo==="object"?d.resumo:{};const formas=lista(d,"formas_pagamento"),produtos=lista(d,"produtos"),visitas=lista(d,"visitas"),vendedores=lista(d,"resumo_vendedores");const vendas=visitas.filter(v=>v.comprou==="sim");const clientes=[...new Map(visitas.map(v=>[`${v.cliente_avulso_id?"A":"C"}:${v.cliente_avulso_id||v.cliente_id}`,v])).values()];document.getElementById("tituloRelatorio").textContent=titulo;document.getElementById("periodoRelatorio").textContent=`Período: ${d.data_inicial} a ${d.data_final}`;document.getElementById("usuarioRelatorio").textContent=role==="admin"?`Administrador: ${nome}`:`Vendedor: ${nome}`;document.getElementById("geradoEm").textContent=`Gerado em ${new Date().toLocaleString("pt-BR")}`;document.getElementById("metricas").innerHTML=metricas(r);document.getElementById("formas").innerHTML=tabela(["Forma","Vendas","Total líquido","Recebido"],formas.map(f=>[f.forma_pagamento,f.vendas,dinheiro(f.total),dinheiro(f.recebido)]));document.getElementById("produtos").innerHTML=tabela(["Produto","Quantidade","Subtotal bruto"],produtos.map(p=>[p.produto_nome,p.quantidade,dinheiro(p.total)]));document.getElementById("clientes").innerHTML=tabela(["Cliente","Vendedor","Último atendimento"],clientes.map(v=>[v.cliente_nome,v.vendedor_nome||nome,v.data_visita]));document.getElementById("secaoVendedores").hidden=role!=="admin";document.getElementById("vendedores").innerHTML=tabela(["Vendedor","Visitas","Vendas","Bruto","Descontos","Líquido","Recebido","Pendente"],vendedores.map(v=>[v.vendedor_nome,v.visitas,v.vendas,dinheiro(v.total_bruto),dinheiro(v.descontos),dinheiro(v.total_liquido),dinheiro(v.total_recebido),dinheiro(v.total_pendente)]));document.getElementById("vendas").innerHTML=tabela(["Venda","Data","Cliente","Vendedor","Total","Recebido","Pendente","Forma","Situação","Recibo"],vendas.map(v=>[`#${v.id}`,v.data_visita,v.cliente_nome,v.vendedor_nome||nome,dinheiro(v.valor_total),dinheiro(v.valor_recebido),dinheiro(Number(v.valor_total||0)-Number(v.valor_recebido||0)),v.forma_pagamento,v.situacao_pagamento,`<button class="btn sec" type="button" data-ticket="${v.id}">Ver ticket</button>`]));document.querySelectorAll("[data-ticket]").forEach(b=>b.onclick=()=>abrirTicket(Number(b.dataset.ticket)));textoAtual=montarResumoTexto(d);document.getElementById("resultado").hidden=false;setStatus("Relatório gerado.","ok")}
async function carregar(){const ini=document.getElementById("data_inicial").value,fim=document.getElementById("data_final").value;try{setStatus("Carregando...");const resp=await fetch(`${API_URL}/api/relatorio-dia?data_inicial=${ini}&data_final=${fim}`,{headers:{Authorization:"Bearer "+token}});const d=await resp.json().catch(()=>({}));if(!resp.ok)throw new Error(d.error||"Erro ao carregar relatório");renderizar(d)}catch(e){setStatus(e.message,"err")}}
function abrirTicket(id){const venda=lista(dadosAtuais,"visitas").find(v=>Number(v.id)===id);if(!venda)return;const itens=Array.isArray(venda.itens)?venda.itens:[];document.getElementById("ticketConteudo").innerHTML=`<div class="empresa">Vovó Maria Pães e Biscoitos</div><h2>Ticket da venda #${venda.id}</h2><p>Data: ${venda.data_visita}<br>Cliente: <strong>${venda.cliente_nome}</strong><br>Vendedor: ${venda.vendedor_nome||nome}</p>${itens.map(i=>`<div class="ticket-item"><span>${i.produto_nome}<br>${i.quantidade} × ${dinheiro(i.preco_unitario)}</span><strong>${dinheiro(i.subtotal)}</strong></div>`).join("")||"<p>Itens não disponíveis.</p>"}<p class="right">Bruto: ${dinheiro(Number(venda.valor_total||0)+Number(venda.desconto||0))}<br>Desconto: ${dinheiro(venda.desconto)}<br><strong>Total líquido: ${dinheiro(venda.valor_total)}</strong><br>Recebido: ${dinheiro(venda.valor_recebido)}<br>Pendente: ${dinheiro(Number(venda.valor_total||0)-Number(venda.valor_recebido||0))}<br>Pagamento: ${venda.forma_pagamento}<br>Situação: ${venda.situacao_pagamento}</p>`;document.getElementById("modalTicket").hidden=false}
document.querySelectorAll("[data-periodo]").forEach(b=>b.onclick=()=>periodo(b.dataset.periodo));document.getElementById("buscar").onclick=carregar;document.getElementById("copiar").onclick=()=>copiarTexto(textoAtual);document.getElementById("compartilhar").onclick=async()=>{if(navigator.share)await navigator.share({title:titulo,text:textoAtual});else await copiarTexto(textoAtual)};document.getElementById("imprimir").onclick=()=>window.print();document.getElementById("fecharTicket").onclick=()=>document.getElementById("modalTicket").hidden=true;document.getElementById("imprimirTicket").onclick=()=>{document.body.classList.add("imprimir-ticket");window.print();document.body.classList.remove("imprimir-ticket")};document.getElementById("sair").onclick=e=>{e.preventDefault();localStorage.clear();location.href="login.html"};periodo("hoje");
</script></body></html>
